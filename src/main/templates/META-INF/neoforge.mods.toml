# Mod metadata file. Values written in dollar-brace form are replaced at build
# time from gradle.properties (see generateModMetadata in build.gradle), so mod
# identity is edited in one place only.
# See https://docs.neoforged.net/docs/concepts/modfiles/ for the full schema.

modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[modproperties.${mod_id}]
# Optional: background texture for this mod's Configured config screen (see the
# In-game config editing section of README.md). Any existing texture works.
configuredBackground = "minecraft:textures/block/stone.png"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Optional integrations. Each is gated behind ModList.isLoaded in exactly one
# integration class (Sophisticated Backpacks on the server, Loot Journal on the
# client, Lightman's Currency on the server, party adapters server-side), so
# none of them can class-load when the dependency is absent.
[[dependencies.${mod_id}]]
modId = "sophisticatedbackpacks"
type = "optional"
versionRange = "[3.26,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "loot_journal"
type = "optional"
versionRange = "[6.2,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "better_party"
type = "optional"
versionRange = "[1.1,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "ftbteams"
type = "optional"
versionRange = "[2101.1,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "openpartiesandclaims"
type = "optional"
versionRange = "[0.30,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "lightmanscurrency"
type = "optional"
versionRange = "[1.21-2.3.0.6,)"
ordering = "AFTER"
side = "BOTH"
