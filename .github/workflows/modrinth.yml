name: Publish to Modrinth

# Deliberately separate from release.yml. A Modrinth outage fails only this
# workflow and never the GitHub release.
#
# Mirrors the CurseForge flow (the reference implementation is
# tiered-echoes/.github/workflows/curseforge.yml), with one documented
# difference: a repo that has configured NEITHER secret is treated as not
# listed on Modrinth yet and skips with a notice, while a repo that has
# configured only ONE of the two fails loudly - a half-configured repo is a
# mistake, an unconfigured repo is a deliberate deferral.
#
# The release: published trigger is NOT sufficient on its own. GitHub refuses
# to cascade workflow runs started by the default GITHUB_TOKEN, and release.yml
# is the only thing that creates releases - so a release published by that
# token would never start this workflow. workflow_dispatch is explicitly exempt
# from that rule, so release.yml can dispatch this directly after tagging when
# that wiring lands. The release trigger is kept for releases created by hand.
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: modrinth-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}
      # Either the release event or the dispatch input, never both.
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Resolve channel from the tag
        id: channel
        run: |
          set -euo pipefail

          if [ -z "$RELEASE_TAG" ]; then
            echo "::error::No release tag supplied. Expected one from the release event or the dispatch input."
            exit 1
          fi
          echo "tag: $RELEASE_TAG"

          # Alphas are GitHub-only by decision, mirroring the CurseForge flow:
          # they are rolling builds of the loader branch, and publishing them
          # would bury the channel users actually browse.
          #
          # Tags are <loader line>-<version>, and neither the loader nor the
          # Minecraft-version token carries a hyphen, so the version starts
          # after the second one. Classify on the version alone: the loader
          # line's own hyphens must not read as a pre-release suffix (they
          # would drag every stable tag into the beta branch). A tag without
          # the loader prefix (legacy v<version>, hand dispatch) passes
          # unchanged.
          VERSION="${RELEASE_TAG#*-*-}"
          case "$VERSION" in
            *+g*|*-alpha*)
              echo "channel=alpha" >> "$GITHUB_OUTPUT"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "reason=alphas are published to GitHub only, not Modrinth" >> "$GITHUB_OUTPUT"
              echo "version_type=alpha" >> "$GITHUB_OUTPUT"
              ;;
            *-*)
              echo "channel=beta" >> "$GITHUB_OUTPUT"
              echo "publish=true" >> "$GITHUB_OUTPUT"
              echo "reason=tag carries a pre-release suffix" >> "$GITHUB_OUTPUT"
              echo "version_type=beta" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "channel=stable" >> "$GITHUB_OUTPUT"
              echo "publish=true" >> "$GITHUB_OUTPUT"
              echo "reason=clean version tag" >> "$GITHUB_OUTPUT"
              echo "version_type=release" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Skip alphas
        if: steps.channel.outputs.publish != 'true'
        run: |
          echo "Skipping Modrinth upload for $RELEASE_TAG."
          echo "${{ steps.channel.outputs.reason }}."

      - name: Check Modrinth configuration
        id: config
        if: steps.channel.outputs.publish == 'true'
        env:
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$MODRINTH_PROJECT_ID" ] && [ -z "$MODRINTH_TOKEN" ]; then
            echo "::notice::This repo has no Modrinth configuration - skipping the upload."
            echo "::notice::Add MODRINTH_PROJECT_ID and MODRINTH_TOKEN under Settings > Secrets and variables > Actions when the project is listed."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MISSING=""
          [ -z "$MODRINTH_PROJECT_ID" ] && MISSING="$MISSING MODRINTH_PROJECT_ID"
          [ -z "$MODRINTH_TOKEN" ] && MISSING="$MISSING MODRINTH_TOKEN"

          if [ -n "$MISSING" ]; then
            echo "::error::Cannot publish a ${{ steps.channel.outputs.channel }} release to Modrinth."
            echo "::error::Missing required secret(s):$MISSING"
            echo "::error::Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi

          echo "Secrets present."
          echo "configured=true" >> "$GITHUB_OUTPUT"

      # Only the publish path reads the tree - the skip and unconfigured paths
      # above must never depend on the tag's contents. Checkout is AT the tag
      # being published so the metadata describes the artifact itself.
      - uses: actions/checkout@v7
        if: steps.channel.outputs.publish == 'true' && steps.config.outputs.configured == 'true'
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      # Game version and loader derive from gradle.properties (loader_id +
      # minecraft_version, #112) like every other loader value - promoting
      # this file into a line or repo needs no edits, and loader_id's values
      # are already Modrinth's lowercase forms ("neoforge", "forge").
      - name: Derive the platform metadata
        id: platform
        if: steps.channel.outputs.publish == 'true' && steps.config.outputs.configured == 'true'
        run: |
          set -euo pipefail
          MINECRAFT_VERSION=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]' || true)
          LOADER_ID=$(grep '^loader_id=' gradle.properties | cut -d= -f2 | tr -d '[:space:]' || true)
          if [ -z "$MINECRAFT_VERSION" ] || [ -z "$LOADER_ID" ]; then
            echo "::error::gradle.properties at $RELEASE_TAG must define minecraft_version and loader_id (neoforge-mod-template #112); this tag predates the key."
            exit 1
          fi
          echo "minecraft version: $MINECRAFT_VERSION"
          echo "loader: $LOADER_ID"
          echo "minecraft_version=$MINECRAFT_VERSION" >> "$GITHUB_OUTPUT"
          echo "mod_loaders=[\"$LOADER_ID\"]" >> "$GITHUB_OUTPUT"

      # Both the asset and the notes are read back from the published release
      # rather than taken from the event payload, so this works identically
      # whether it was triggered by the release event or by a dispatch. The jar
      # pattern is deliberately generic - releases attach one jar - but can be
      # tightened per repo if a release ever attaches more than the mod jar.
      - name: Download release asset and notes
        if: steps.channel.outputs.publish == 'true' && steps.config.outputs.configured == 'true'
        run: |
          set -euo pipefail
          mkdir -p staged
          gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" \
            --pattern '*.jar' \
            --dir staged
          ls -la staged
          echo "ASSET=$(ls staged/*.jar | head -1)" >> "$GITHUB_ENV"

          gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --json body --jq '.body' > notes.md
          echo "Release notes ($(wc -c < notes.md) bytes):"
          cat notes.md

      # mc-publish (Kir-Antipov/mc-publish@v3.3) is the org's chosen publishing
      # action (ruling: neoforge-mod-template #82) - it owns the multipart
      # metadata, the file parts and the platform API shape, replacing the
      # hand-rolled curl upload that #74 had to debug line by line.
      - name: Upload to Modrinth
        if: steps.channel.outputs.publish == 'true' && steps.config.outputs.configured == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: staged/*.jar
          version: ${{ env.RELEASE_TAG }}
          version-type: ${{ steps.channel.outputs.version_type }}
          name: ${{ env.RELEASE_TAG }}
          changelog-file: notes.md
          game-versions: ${{ steps.platform.outputs.minecraft_version }}
          loaders: ${{ steps.platform.outputs.mod_loaders }}
          modrinth-featured: false
