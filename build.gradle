plugins {
    id 'java-library'
    id 'maven-publish'
    id 'checkstyle'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'com.github.spotbugs' version '6.5.13'
    id 'com.diffplug.spotless' version '8.10.4'
}

version = mod_version
group = mod_group_id

base {
    // Must match rootProject.name and mod_id; the jar is <mod_id>-<version>.jar.
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

// Game tests compile against main but are never part of it, so the jar cannot
// ship them. Declared before neoForge because the mods block joins it.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += output + sourceSets.main.output + configurations.runtimeClasspath
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        // Headless verification: boots GameTestServer, runs every @GameTest, exits.
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.layout.projectDirectory.dir('run')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            // Joined so @GameTestHolder is discovered in dev runs; still not jarred.
            sourceSet sourceSets.gametest
        }
    }
}

// Expands the ${...} placeholders in src/main/templates into the real
// neoforge.mods.toml, so mod identity is edited in gradle.properties only.
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
// Passing the provider as a source dir also wires the generation order.
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// The junit CI check refuses to pass an empty suite, so this stays wired in
// every derived repo.
repositories {
    mavenCentral()
    // CurseMaven - resolves mod jars by CurseForge project + file id, so a
    // clean checkout (and CI) resolves every jar without a local folder.
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    // Modrinth Maven - Open Parties and Claims is pinned from Modrinth.
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

// Runtime closure for the GameTest run: staged into run/mods by
// prepareGametestMods, exactly like the rest of the org's mod repos.
configurations {
    gametestMods
}

dependencies {
    // Pins live here rather than in gradle.properties: the version doctrine
    // keeps that file for version bumps only (ci.yml), so pins ride with the
    // dependency that needs them. File ids are the pack's installed files.
    def sophisticatedBackpacksFileId = '9431839' // sophisticatedbackpacks-1.21.1-3.26.20.2244
    def sophisticatedCoreFileId = '9477647'      // sophisticatedcore-1.21.1-1.5.31.2460
    def lootJournalFileId = '8922056'            // loot_journal-neoforge-1.21.1-6.2.2
    def betterPartyFileId = '9435051'             // better-party-neoforge-1.21.1-1.1.9
    def ftbTeamsFileId = '9434081'                // ftb-teams-neoforge-2101.1.12
    def ftbLibraryFileId = '9350706'             // ftb-library-neoforge-2101.1.39 (project ftb-library-forge)
    def architecturyFileId = '8492726'           // architectury-api (neoforge, 1.21.1)
    def opacVersion = 'neoforge-1.21.1-0.33.0'   // open-parties-and-claims (Modrinth)
    def lightmansCurrencyFileId = '9048585'      // lightmanscurrency-1.21-2.3.0.6

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Optional integrations: compile against the real APIs, never ship them.
    // Each is gated behind ModList.isLoaded in its own adapter class.
    compileOnly "curse.maven:sophisticated-backpacks-422301:${sophisticatedBackpacksFileId}"
    compileOnly "curse.maven:sophisticated-core-618298:${sophisticatedCoreFileId}"
    compileOnly "curse.maven:loot-journal-1120395:${lootJournalFileId}"
    compileOnly "curse.maven:better-party-1610184:${betterPartyFileId}"
    compileOnly "curse.maven:ftb-teams-404468:${ftbTeamsFileId}"
    compileOnly "maven.modrinth:open-parties-and-claims:${opacVersion}"
    compileOnly "curse.maven:lightmans-currency-472521:${lightmansCurrencyFileId}"

    // GameTest runtime: the backpack GameTests need Sophisticated Backpacks
    // and its required Sophisticated Core; the party-adapter smoke GameTest
    // needs every party mod staged (FTB Teams hard-requires ftblibrary and
    // architectury); the wallet GameTests need Lightman's Currency. Loot
    // Journal is client-only and never staged.
    gametestMods "curse.maven:sophisticated-backpacks-422301:${sophisticatedBackpacksFileId}"
    gametestMods "curse.maven:sophisticated-core-618298:${sophisticatedCoreFileId}"
    gametestMods "curse.maven:better-party-1610184:${betterPartyFileId}"
    gametestMods "curse.maven:ftb-teams-404468:${ftbTeamsFileId}"
    gametestMods "curse.maven:ftb-library-forge-404465:${ftbLibraryFileId}"
    gametestMods "curse.maven:architectury-api-419699:${architecturyFileId}"
    gametestMods "maven.modrinth:open-parties-and-claims:${opacVersion}"
    gametestMods "curse.maven:lightmans-currency-472521:${lightmansCurrencyFileId}"
}

test {
    useJUnitPlatform()
}

// --- GameTest harness -------------------------------------------------------

// Stage the gametest runtime closure into run/mods before the headless run,
// exactly like the rest of the org's mod repos.
tasks.register('prepareGametestMods', Sync) {
    from configurations.gametestMods
    into 'run/mods'
}

// Grade the run on the log summary: the task's exit code is not a reliable
// signal. Keep expectedTests in sync with the @GameTest methods.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn 'prepareGametestMods'

    // Keep the world, drop only party/team state: stale FTB Teams or Better
    // Party data from a prior run breaks the next run's mock joins, but the
    // world seed (and the structure chunks vanilla force-loads) persist, so
    // local reruns keep the same grid position instead of gambling on a new
    // random one each time.
    doFirst {
        delete 'run/world/ftbteams'
        delete 'run/world/data/better_party_parties.dat'
    }

    // Vanilla places test structures at a random far position and a test only
    // starts once every structure chunk is entity-ticking; on a first run at
    // an unlucky position that can stall forever (chunk-gated tests never
    // reach their timeout). Fail fast instead of hanging for hours - rerun
    // with a fresh world (delete run/world) to roll a new position.
    timeout = java.time.Duration.ofMinutes(10)

    def expectedTests = 20
    doLast {
        def log = file('run/logs/latest.log')
        if (!log.exists()) {
            throw new GradleException("GameTest produced no log at ${log}")
        }
        def text = log.text
        def problems = []
        def passMatcher = (text =~ /All (\d+) required tests passed/)
        if (passMatcher.find()) {
            def passed = passMatcher.group(1) as int
            if (passed != expectedTests) {
                problems << "only ${passed}/${expectedTests} tests passed"
            }
        } else if ((text =~ /\d+ required tests failed/).find()) {
            problems << 'GameTest reported failed tests'
        } else {
            problems << 'no GameTest summary found in log'
        }
        if (text.contains('Encountered an unexpected exception')) {
            problems << 'server crashed during tests'
        }
        if (problems) {
            throw new GradleException("GameTest failed: ${problems.join('; ')} - see ${log}")
        }
        logger.lifecycle("GameTest OK: all ${expectedTests} tests passed")
    }
}

// --- Publishing -------------------------------------------------------------

// release.yml tags, publish.yml drives this block. Keep the URL pointing at
// THIS repository; local publishes may set gpr.user / gpr.key.
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
            artifactId = mod_id
            pom {
                name = mod_name
                description = mod_description
                licenses {
                    license {
                        name = mod_license
                    }
                }
            }
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/HexaHexes/quick-loot')
            credentials {
                username = System.getenv('GITHUB_ACTOR') ?: project.findProperty('gpr.user')
                password = System.getenv('GITHUB_TOKEN') ?: project.findProperty('gpr.key')
            }
        }
    }
}

// --- Static analysis (enforced) ----------------------------------------------
// The `static` CI job is the gate for all three. SpotBugs and Checkstyle ride
// Gradle's `check` graph too; Spotless stays out of it by design. Rationale and
// the shared-filter rules live in agents/AGENTS.md.
spotbugs {
    effort = com.github.spotbugs.snom.Effort.MAX
    excludeFilter = file('config/spotbugs-exclude.xml')
}

spotbugsTest {
    enabled = false
}

spotbugsMain {
    reports {
        html.required = true
        xml.required = false
    }
}

checkstyle {
    toolVersion = '10.21.0'
    configFile = file('config/checkstyle/checkstyle.xml')
    maxWarnings = 0
}

tasks.withType(Checkstyle).configureEach {
    reports {
        html.required = true
        xml.required = true
    }
}

spotless {
    enforceCheck false
    java {
        // Minimal profile only: no formatter, so no repo-wide rewrites.
        target 'src/*/java/**/*.java'
        trimTrailingWhitespace()
        endWithNewline()
        importOrder()
    }
}
